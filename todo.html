<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-hover: #1a1a1a;
      --border: #222222;
      --accent: #e8ff00;
      --danger: #ff4444;
      --text-primary: #f0f0f0;
      --text-secondary: #666666;
      --done: #333333;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem 2rem;
    }

    /* --- HEADER --- */
    header {
      width: 100%;
      max-width: 560px;
      margin-bottom: 2.5rem;
    }

    .header-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* --- INPUT --- */
    .input-area {
      width: 100%;
      max-width: 560px;
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
    }

    #task-input {
      flex: 1;
      padding: 0.9rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #task-input::placeholder {
      color: var(--text-secondary);
    }

    #task-input:focus {
      border-color: var(--accent);
    }

    #add-btn {
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      border: none;
      color: #000;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      line-height: 1;
    }

    #add-btn:hover {
      opacity: 0.85;
    }

    /* --- FILTERS --- */
    .filters {
      width: 100%;
      max-width: 560px;
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .filter-btn {
      flex: 1;
      padding: 0.6rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }

    .filter-btn:not(.active):hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    /* --- LIST --- */
    #task-list {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--surface);
      transition: background 0.15s;
      animation: slideIn 0.18s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      background: var(--surface-hover);
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    /* チェックボックス */
    .check-btn {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
      padding: 0;
    }

    .check-btn:hover {
      border-color: var(--accent);
    }

    .task-item.done .check-btn {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-btn svg {
      width: 12px;
      height: 12px;
      stroke: #000;
      stroke-width: 3;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .task-item.done .check-btn svg {
      opacity: 1;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-all;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: color 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    .task-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .delete-btn svg {
      width: 16px;
      height: 16px;
    }

    /* --- EMPTY STATE --- */
    .empty {
      width: 100%;
      max-width: 560px;
      padding: 3rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      border: 1px dashed var(--border);
    }

    /* --- FOOTER --- */
    .list-footer {
      width: 100%;
      max-width: 560px;
      margin-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-count {
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      padding: 0;
      transition: color 0.15s;
    }

    .clear-btn:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>

  <header>
    <p class="header-label">Task Manager</p>
    <h1>TODO</h1>
  </header>

  <div class="input-area">
    <input id="task-input" type="text" placeholder="新しいタスクを入力..." maxlength="100" />
    <button id="add-btn" aria-label="追加">+</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="active">未完了</button>
    <button class="filter-btn" data-filter="done">完了済み</button>
  </div>

  <div id="task-list"></div>

  <div class="list-footer">
    <span class="task-count" id="task-count"></span>
    <button class="clear-btn" id="clear-done-btn">完了済みを削除</button>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    const input = document.getElementById('task-input');
    const list  = document.getElementById('task-list');
    const count = document.getElementById('task-count');

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      const filtered = tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done')   return t.done;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">タスクがありません</div>`;
      } else {
        list.innerHTML = filtered.map(t => `
          <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
            <button class="check-btn" onclick="toggle(${t.id})" aria-label="完了切替">
              <svg viewBox="0 0 24 24" fill="none">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
            <span class="task-text">${escape(t.text)}</span>
            <button class="delete-btn" onclick="remove(${t.id})" aria-label="削除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        `).join('');
      }

      const active = tasks.filter(t => !t.done).length;
      count.textContent = `残り ${active} 件`;
    }

    function escape(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    function remove(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    document.getElementById('add-btn').addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    document.getElementById('clear-done-btn').addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>

</body>
</html>
