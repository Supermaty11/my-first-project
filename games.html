<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Party Games</title>
  <style>
    :root {
      --bg: #0c0610;
      --bg-2: #1a0b18;
      --surface: rgba(28, 14, 32, 0.88);
      --gold: #f3c14a;
      --gold-2: #ffe9a3;
      --ink: #fff7ea;
      --muted: #c9b8a4;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #3a1533 0%, transparent 50%),
        radial-gradient(900px 500px at 110% 10%, #1d2a4a 0%, transparent 46%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      min-height: 100dvh;
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }
    .brand small {
      letter-spacing: 0.28em;
      font-size: 10px;
      color: var(--gold);
      text-transform: uppercase;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 6px 0 8px;
    }
    .lead {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .list { display: grid; gap: 12px; }
    a.card, .card.soon {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid rgba(243,193,74,0.22);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
    }
    a.card:active { transform: scale(0.99); }
    .card.soon {
      opacity: 0.55;
      border-style: dashed;
      cursor: default;
    }
    .tag {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .card h2 { font-size: 20px; margin-bottom: 6px; }
    .card p { color: var(--muted); font-size: 13px; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand"><small>Party Games</small></div>
    <h1>ゲームを選ぶ</h1>
    <p class="lead">キングスカップから開始できます。ほかのゲームは準備中です。</p>
    <div class="list">
      <a class="card" href="kings-cup.html">
        <div class="tag">PLAY</div>
        <h2>King's Cup</h2>
        <p>トランプをめくって役に従う飲み会ゲーム。54枚＋ジョーカー。</p>
      </a>
      <div class="card soon" aria-disabled="true">
        <div class="tag">準備中</div>
        <h2>次のゲーム</h2>
        <p>追加時はここの一覧に並びます。キングスカップのファイルは分けてあります。</p>
      </div>
    </div>
  </div>
</body>
</html>
